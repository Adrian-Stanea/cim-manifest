# CIM manifest index. Every directory matching a pattern below that holds an
# sdk.yml is a target named after the directory.
members:
  - "."                # the repository root itself (named after the repository)
  - "examples/*"
  - "examples/hello"   # overlaps the glob above: the same manifest twice is fine
  - "tools/*"

# Explicit entries combine with members: and can live anywhere.
targets:
  docs: extras/docs/sdk.yml
