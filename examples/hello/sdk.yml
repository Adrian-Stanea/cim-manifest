mirror: $HOME/tmp/mirror
gits:
  - name: hello-world
    url: https://github.com/octocat/Hello-World.git
    commit: master
    build: |
      @echo "Building hello-world"
  - name: git-sandbox
    url: https://github.com/kevin-bates/git-sandbox.git
    commit: master
copy_files:
  - source: src/
    dest: src/
  - source: motd.txt
    dest: motd.txt
  - source: patches/*.patch
    dest: patches/
